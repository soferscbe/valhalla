name: Import approved ProductLens history and verify
on:
  push:
    branches: [codex/import-approved-history]
permissions:
  contents: write
jobs:
  import-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: productlens_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: productlens_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U productlens_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify approved bundle and preserve both histories
        shell: bash
        env:
          APPROVED_HEAD: e4211a46ffcc04b5084418b82333a3cfedb063e1
          INITIAL_HEAD: 91379afe7d0c0b49015e0d22cc34ac64a418f7a0
        run: |
          set -euo pipefail
          echo '381afe0c33e2cd167d17c6f18ea36c76ef5e26fc885becb24950b5156dc177a0  .publication/source.bundle' | sha256sum --check
          git bundle verify .publication/source.bundle
          git fetch .publication/source.bundle refs/heads/codex/semantic-milestone:refs/heads/codex/semantic-milestone
          test "$(git rev-parse codex/semantic-milestone)" = "$APPROVED_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$INITIAL_HEAD"
          git push origin refs/heads/codex/semantic-milestone:refs/heads/codex/semantic-milestone
          git config user.name 'Sofers Paul Durai Alexander'
          git config user.email 'sofers.cbe@gmail.com'
          merged=$(git commit-tree "$APPROVED_HEAD^{tree}" -p "$INITIAL_HEAD" -p "$APPROVED_HEAD" -m 'Publish approved ProductLens AI project preserving both histories')
          git push origin "$merged:refs/heads/main"
          git checkout --detach "$merged"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$APPROVED_HEAD^{tree}")"
          echo "Published commit: $merged" >> "$GITHUB_STEP_SUMMARY"
          echo "Approved source: $APPROVED_HEAD" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            deployment/requirements.txt
      - name: Install pinned Linux CPU environment
        run: python -m pip install -r deployment/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Prepare pinned semantic model
        run: python -m productlens.embeddings
      - name: Test real model and PostgreSQL
        env:
          PRODUCTLENS_OFFLINE: '1'
          PRODUCTLENS_TEST_REAL_MODEL: '1'
          PRODUCTLENS_TEST_POSTGRES_URL: postgresql://productlens_ci:ephemeral_ci_only@127.0.0.1:5432/productlens_ci
        run: python -m pytest -q
