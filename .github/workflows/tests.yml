name: Python and PostgreSQL verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: productlens_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: productlens_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U productlens_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            deployment/requirements.txt
      - name: Install pinned Linux CPU environment
        run: python -m pip install -r deployment/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Prepare pinned semantic model
        run: python -m productlens.embeddings
      - name: Test real model and disposable PostgreSQL service
        env:
          PRODUCTLENS_OFFLINE: '1'
          PRODUCTLENS_TEST_REAL_MODEL: '1'
          PRODUCTLENS_TEST_POSTGRES_URL: postgresql://productlens_ci:ephemeral_ci_only@127.0.0.1:5432/productlens_ci
        run: python -m pytest -q
